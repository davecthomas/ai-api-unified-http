# ai-api-unified middleware profile owned by this service deployment.
#
# One file is the single control point for every web app behind the service
# (docs/requirements.md, hard requirement 2). The library reads it from
# AI_MIDDLEWARE_CONFIG_PATH, which the service defaults to this file.

middleware:
  # Observability and cost attribution.
  #
  # emit_cost defaults to FALSE in the library, so without this block the
  # service would attach a handler to a topic that never receives anything and
  # record no spend at all. Startup verifies this setting is on, so deleting it
  # fails the service rather than silently losing every cost event.
  - name: observability
    enabled: true
    settings:
      direction: input_output
      # Omitted capabilities means all of them.
      log_level: INFO
      emit_cost: true
      include_provider_usage: true
      emit_error_events: true

  # PII redaction is OFF by default, and that is a deliberate choice rather
  # than an oversight.
  #
  # The library refuses to stream while redaction is enabled, because redaction
  # cannot be guaranteed across chunk boundaries:
  #
  #   "Streaming completions are unavailable while PII redaction middleware is
  #    enabled: redaction cannot be guaranteed across stream chunk boundaries."
  #
  # The profile is process-wide with no per-call override, so a deployment gets
  # redaction or streaming, never both. The default keeps every endpoint
  # working, including the streaming one.
  #
  # A deployment handling personal data flips `enabled` to true below and
  # accepts that /v1/completions with stream=true then returns 400 carrying the
  # library's explanation. docs/technical-design.md, "Middleware profile",
  # covers the trade in full.
  - name: pii_redaction
    enabled: false
    settings:
      direction: input_only
      strict_mode: false
      detection_profile: balanced
      language: en
      country_scope: US
