# ai-api-unified middleware profile owned by this service deployment.
#
# One file is the single control point for every web app behind the service
# (docs/requirements.md, hard requirement 2). The library reads it from
# AI_MIDDLEWARE_CONFIG_PATH, which the service defaults to this file.

middleware:
  # Observability and cost attribution.
  #
  # emit_cost defaults to FALSE in the library, so without this block the
  # service would attach a handler to a topic that never receives anything and
  # record no spend at all. Startup verifies this setting is on, so deleting it
  # fails the service rather than silently losing every cost event.
  - name: observability
    enabled: true
    settings:
      direction: input_output
      # Omitted capabilities means all of them.
      log_level: INFO
      emit_cost: true
      include_provider_usage: true
      emit_error_events: true

  # PII redaction, off by default so the streaming endpoint works.
  #
  # The library will not stream while redaction is enabled, and this profile is
  # process-wide with no per-call override, so a deployment gets one or the
  # other. Set `enabled: true` when handling personal data and accept that
  # /v1/completions with stream=true then returns 400.
  - name: pii_redaction
    enabled: false
    settings:
      direction: input_only
      strict_mode: false
      detection_profile: balanced
      language: en
      country_scope: US
