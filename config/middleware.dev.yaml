# Development middleware profile — used by `make serve` and `make all`.
#
# Identical to config/middleware.yaml except that PII redaction is OFF, which
# is what lets the streaming endpoint run.
#
# The library refuses to stream while redaction is enabled, because redaction
# cannot be guaranteed across chunk boundaries:
#
#   "Streaming completions are unavailable while PII redaction middleware is
#    enabled: redaction cannot be guaranteed across stream chunk boundaries."
#
# The profile is process-wide, so a single deployment gets redaction or
# streaming, never both. The production default keeps redaction (hard
# requirement 2); this profile drops it so the local harness can exercise the
# streaming path. Never point a deployment handling real user data at this
# file.

middleware:
  - name: observability
    enabled: true
    settings:
      direction: input_output
      log_level: INFO
      emit_cost: true
      include_provider_usage: true
      emit_error_events: true
