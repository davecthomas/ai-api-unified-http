[project]
name = "ai_api_unified_http"

version = "1.6.0" # keep in sync with src/ai_api_unified_http/__version__.py and the README.md title
description = "HTTP service exposing ai-api-unified to non-Python apps"
authors = [{ name = "Dave Thomas", email = "davidcthomas@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Provider SDKs are optional extras of the library. The service is a
    # deployed unit rather than a library, so it installs the engines
    # env_template documents; without them every call fails at client
    # construction with "requires optional extra". middleware-pii-redaction is
    # required by hard requirement 2, which puts every call through the
    # library's redaction and observability middleware.
    "ai-api-unified[anthropic,google-gemini,middleware-pii-redaction,openai] (==2.22.0)",
    "fastapi (>=0.115,<1.0)",
    # Read directly by config.py. It arrives transitively today, but a direct
    # import belongs in the direct dependencies.
    "python-dotenv (>=1.0,<2.0)",
    "uvicorn[standard] (>=0.30,<1.0)",
    # Production server. docs/technical-design.md specifies gunicorn with
    # uvicorn workers; the container runs it, so it is a runtime dependency.
    "gunicorn (>=22.0,<24.0)",
]

[project.optional-dependencies]
dev = [
    "pytest (>=8.0)",
    "httpx (>=0.27)",
    "black (>=24.0)",
    "ruff (>=0.5)",
]

[tool.poetry]
packages = [{ include = "ai_api_unified_http", from = "src" }]

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"
